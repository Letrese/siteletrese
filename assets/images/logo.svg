<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <!-- Fonte Raleway embutida via style -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;800;900&amp;display=swap');
      .brand-text {
        font-family: 'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: #000000;
        letter-spacing: -0.5px;
      }
      .brand-plus {
        fill: #37BFA5;
        font-weight: 900;
      }
      .sub-text {
        font-family: 'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #000000;
        letter-spacing: 0.1px;
      }
    </style>
  </defs>

  <!-- Logotipo horizontal oficial letre+se -->
  <text x="10" y="66" class="brand-text">letre<tspan class="brand-plus">+</tspan>se</text>
  
  <!-- Linha divisória vertical (manual pág. 2) -->
  <line x1="255" y1="22" x2="255" y2="78" stroke="#000000" stroke-width="1.2" opacity="0.8" />
  
  <!-- Subtítulo em duas linhas: grupo de pesquisa em / letramento estatístico -->
  <text x="274" y="47" class="sub-text">grupo de pesquisa em</text>
  <text x="274" y="69" class="sub-text">letramento estatístico</text>
</svg>
