<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="grad-mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <rect x="8" y="14" width="52" height="52" rx="14" fill="url(#grad-mark)" />
  <rect x="8" y="14" width="52" height="52" rx="14" stroke="url(#grad-accent)" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Stylized Monogram L & T & E with network node dots -->
  <path d="M 22 28 L 22 52 L 46 52" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 26 36 L 44 36" stroke="url(#grad-accent)" stroke-width="3" stroke-linecap="round" />
  <circle cx="22" cy="28" r="3.5" fill="#38bdf8" />
  <circle cx="46" cy="52" r="3.5" fill="#06b6d4" />
  <circle cx="44" cy="36" r="3" fill="#60a5fa" />
  
  <!-- Brand Text -->
  <text x="74" y="44" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#0f172a">
    LETRE<tspan fill="#2563eb">SE</tspan>
  </text>
  <text x="75" y="59" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.8" fill="#64748b" text-transform="uppercase">
    GRUPO DE PESQUISA
  </text>
</svg>
