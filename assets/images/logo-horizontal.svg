<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <style>
      .brand-title {
        font-family: 'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 56px;
        fill: #000000;
        letter-spacing: -0.02em;
      }
      .brand-plus-sign {
        fill: #37BFA5;
        font-weight: 900;
      }
      .brand-subtext {
        font-family: 'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #000000;
        letter-spacing: 0.01em;
      }
    </style>
  </defs>

  <!-- Logotipo horizontal oficial letre+se -->
  <text x="0" y="68" class="brand-title">letre<tspan class="brand-plus-sign" dx="2" dy="-2">+</tspan><tspan dx="2" dy="2">se</tspan></text>
  
  <!-- Linha divisória vertical (Manual da Marca pág. 2) -->
  <line x1="265" y1="18" x2="265" y2="82" stroke="#000000" stroke-width="1.25" opacity="0.75" />
  
  <!-- Subtítulo oficial: grupo de pesquisa em / letramento estatístico -->
  <text x="285" y="46" class="brand-subtext">grupo de pesquisa em</text>
  <text x="285" y="73" class="brand-subtext">letramento estatístico</text>
</svg>
