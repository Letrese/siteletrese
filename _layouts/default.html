<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="alternate icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

  <!-- Preload da Imagem Principal (LCP Otimizado) -->
  <link rel="preload" as="image" href="{{ '/assets/images/logo-horizontal-520.webp' | relative_url }}" type="image/webp" fetchpriority="high">

  <!-- Google Fonts: Raleway Otimizado (Sem bloqueio de renderização) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap">
  </noscript>

  <!-- Estilos Principais -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=fullwidth1">

  <!-- Open Graph / Redes Sociais -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
</head>
<body>
  <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

  <!-- Padrões geométricos suaves restritos apenas às extremidades laterais da tela -->
  <div class="lateral-pattern lateral-pattern-left" aria-hidden="true"></div>
  <div class="lateral-pattern lateral-pattern-right" aria-hidden="true"></div>

  <div class="site-wrapper">
    {% unless page.hide_header %}
    {% include header.html %}
    {% endunless %}

    <main id="main-content" role="main">
      {{ content }}
    </main>

    {% include footer.html %}
  </div>

  <!-- Scripts Interativos (Deferido para não bloquear renderização) -->
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
