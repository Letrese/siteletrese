---
layout: default
---

<header class="page-header">
  <div class="container">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page-desc">{{ page.subtitle }}</p>
    {% endif %}
  </div>
</header>

<section class="page-content">
  <div class="container">
    <div class="prose">
      {{ content }}
    </div>
  </div>
</section>
