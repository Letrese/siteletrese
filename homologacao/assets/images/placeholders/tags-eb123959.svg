<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-hidden="true">
  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes shadowBreathe {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(0.92); opacity: 0.05; }
    }
    @keyframes pulseRing {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.18; }
    }
    .poly-float {
      animation: floatSlow 5.8s ease-in-out infinite;
      will-change: transform;
    }
    .poly-shadow {
      animation: shadowBreathe 5.8s ease-in-out infinite;
      transform-origin: center;
    }
    .poly-pulse {
      animation: pulseRing 4.5s ease-in-out infinite;
    }
    .poly-delay-1 { animation-duration: 5.4s; animation-delay: 0s; }
    .poly-delay-2 { animation-duration: 6.4s; animation-delay: -1.8s; }
    .poly-delay-3 { animation-duration: 5.9s; animation-delay: -3.2s; }
    .poly-delay-4 { animation-duration: 6.9s; animation-delay: -4.4s; }
    @media (prefers-reduced-motion: reduce) {
      .poly-float, .poly-shadow, .poly-pulse { animation: none; }
    }
  </style>
