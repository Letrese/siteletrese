    <polygon points="0,-50 -43,-25 0,-22" fill="#ea8b9f"/>
    <polygon points="0,-50 0,-22 43,-25" fill="#bf3752"/>
    <polygon points="-43,-25 -23,16 0,-22" fill="#bf3752"/>
    <polygon points="43,-25 0,-22 23,16" fill="#921f37"/>
    <polygon points="-43,-25 -43,25 -23,16" fill="#bf3752"/>
    <polygon points="43,-25 23,16 43,25" fill="#921f37"/>
    <polygon points="-43,25 0,50 -23,16" fill="#921f37"/>
    <polygon points="-23,16 0,50 23,16" fill="#6b1426"/>
    <polygon points="23,16 0,50 43,25" fill="#6b1426"/>
  
        </g>
