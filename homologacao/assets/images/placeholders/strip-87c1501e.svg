    <circle cx="-6" cy="-6" r="39" fill="#5fd3bc"/>
    <circle cx="-14" cy="-14" r="20" fill="#b8e8de" opacity="0.8"/>
  
        </g>
      </g>
    

      <g class="poly-shape-node" data-shape-tag="Multiletramentos" transform="translate(596, 38) scale(0.42)">
