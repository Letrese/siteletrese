<article class="project-item" data-status="{{ project.status }}">
  <div class="project-item-header">
    <h3 class="project-item-title">
      <a href="{{ project.url | relative_url }}">{{ project.title }}</a>
    </h3>
    <span class="status-badge {% if project.status == 'Em andamento' %}status-ongoing{% else %}status-completed{% endif %}">
      {{ project.status }}
    </span>
  </div>

  <div class="project-meta">
    <span>Coordenação: <strong>{{ project.coordinator }}</strong></span>
    <span>•</span>
    <span>{{ project.start_year }} — {{ project.end_year | default: "Atual" }}</span>
    {% if project.funding %}
      <span>•</span>
      <span>Fomento: {{ project.funding }}</span>
    {% endif %}
  </div>

  <p class="project-summary">
    {{ project.summary | truncate: 180 }}
  </p>

  <a href="{{ project.url | relative_url }}" class="link-more">Ver detalhes do projeto &rarr;</a>
</article>
