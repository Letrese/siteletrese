---
layout: default
title: "Projetos"
---

<header class="page-header">
  <div class="container">
    <h1 class="page-title">Projetos de Pesquisa</h1>
    <p class="page-desc">Projetos em andamento e concluídos desenvolvidos pelo grupo.</p>
  </div>
</header>

<section class="page-content">
  <div class="container">
    <div class="filter-bar">
      <div class="filter-group">
        <button class="filter-btn active" data-project-filter="all">Todos</button>
        <button class="filter-btn" data-project-filter="Em andamento">Em andamento</button>
        <button class="filter-btn" data-project-filter="Concluído">Concluídos</button>
      </div>

      <div class="search-box">
        <input type="text" id="project-search" class="search-input" placeholder="Buscar projeto..." aria-label="Buscar projeto">
      </div>
    </div>

    <div id="no-projects-msg" style="display: none; padding: 2rem; text-align: center; color: var(--text-muted);">
      Nenhum projeto encontrado.
    </div>

    <div class="projects-list" id="projects-list">
      {% for project in site.projects %}
        {% include project_card.html %}
      {% endfor %}
    </div>
  </div>
</section>
