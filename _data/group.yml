# Informações institucionais do Grupo letre+se (Manual da Marca 02/2025 e Diretório de Grupos do CNPq)
title: "letre+se"
full_name: "grupo de pesquisa em letramento estatístico e multiletramentos"
short_description: "Grupo de pesquisa dedicado ao estudo do letramento estatístico e suas interdisciplinaridades, com foco no desenvolvimento de competências para o exercício da cidadania plena e crítica."
institution: "Fundação Instituto Brasileiro de Geografia e Estatística - IBGE"
department: "Escola Nacional de Ciências Estatísticas - ENCE"
founding_year: "2025"

description: "O Grupo Letre-se tem por objetivo pesquisar sobre o letramento estatístico e suas interdisciplinaridades a fim de desenvolver competências para o exercício de uma cidadania plena e crítica. A promoção do letramento ocorre por meio do desenvolvimento e da curadoria de experiências e materiais instrucionais e lúdicos, promoção de eventos acadêmicos e culturais e ações de divulgação e popularização científica. O grupo reúne pesquisadores de instituições e áreas diversas para integrar saberes entre estatística, educação, linguagem e design."

pillars:
  - "letras"
  - "design"
  - "estatística"
  - "educação"

research_lines:
  - id: "Linha 1"
    name: "Letramento estatístico e suas multidisciplinaridades"
    description: "Investigação dos multiletramentos, da linguagem de dados e da interdisciplinaridade do letramento estatístico, promovendo competências para o exercício crítico e cidadão através da ciência, educação e divulgação científica."
    coordinator: "Dra. Renata Souza Bueno e Dra. Bianca Walsh"

