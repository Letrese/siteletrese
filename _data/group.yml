# Informações institucionais do Grupo letre+se (Manual da Marca 02/2025)
title: "letre+se"
full_name: "grupo de pesquisa em letramento estatístico"
short_description: "Grupo de pesquisa formado por profissionais multidisciplinares com o intuito de somar os conhecimentos relacionados ao letramento estatístico e as contribuições das diversas áreas."
institution: "Universidade Federal"
department: "Departamento de Estatística e Educação"
founding_year: "2020"

description: "O letre+se é um grupo de pesquisa formado por profissionais multidisciplinares com o intuito de somar os conhecimentos relacionados ao letramento estatístico e as contribuições das diversas áreas."

pillars:
  - "letras"
  - "design"
  - "estatística"
  - "educação"

research_lines:
  - id: "Linha 1"
    name: "Multiletramentos e Cultura Digital"
    description: "Estudo das práticas de leitura, escrita e multimodalidade em ambientes hipermidiáticos e plataformas digitais."
    coordinator: "Dra. Helena Silva"
  - id: "Linha 2"
    name: "Semiótica Aplicada e Práticas Sociodiscursivas"
    description: "Análise dos processos de significação, linguagens audiovisuais e narrativas contemporâneas."
    coordinator: "Dr. Carlos Eduardo Moraes"
  - id: "Linha 3"
    name: "Tecnologias na Educação e Formação Docente"
    description: "Pesquisa sobre a integração de tecnologias digitais, recursos educacionais e práticas pedagógicas."
    coordinator: "Dra. Helena Silva"

